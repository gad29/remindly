<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connect Remindly</title><style>
body{margin:0;background:#f2f5f1;color:#18332b;font-family:Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(520px,calc(100% - 48px));background:white;border-radius:24px;padding:36px;box-shadow:0 20px 60px #18332b20}.mark{font-size:42px}h1{margin:12px 0 8px}p{color:#587068;line-height:1.55}label{display:block;font-weight:650;margin:26px 0 8px}input{box-sizing:border-box;width:100%;padding:14px 16px;border:1px solid #bfd0c9;border-radius:12px;font-size:16px}button{width:100%;border:0;border-radius:12px;padding:14px;margin-top:14px;background:#17785c;color:white;font-size:16px;font-weight:700;cursor:pointer}.error{color:#b42318;min-height:22px;margin-top:10px}
</style></head><body><main class="card"><div class="mark">✓</div><h1>Connect to Remindly</h1><p>Enter the CloudPanel domain where Remindly is installed. You only need to do this once.</p><label for="url">Remindly domain</label><input id="url" type="url" placeholder="https://remindly.example.com" autofocus><button id="connect">Connect</button><div id="error" class="error"></div></main><script>
const input=document.querySelector('#url'),error=document.querySelector('#error');window.remindlyDesktop.currentUrl().then(value=>input.value=value);document.querySelector('#connect').onclick=async()=>{error.textContent='';try{await window.remindlyDesktop.saveUrl(input.value)}catch(e){error.textContent=e.message||'Please enter a valid domain.'}};
</script></body></html>
